<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль кассовой дисциплины</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #626b78; --border: #e2e5ea;
    --accent: #2457d6; --ok: #1d7a4a; --ok-bg: #e7f5ee; --bad: #b42318; --bad-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa3af; --border: #2b2f37;
            --accent: #6d95ff; --ok: #4cc38a; --ok-bg: #12291e; --bad: #ff7b72; --bad-bg: #3a1714; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  #drop { border: 2px dashed var(--border); border-radius: 10px; padding: 32px 16px; text-align: center;
          cursor: pointer; transition: border-color .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); }
  #drop b { color: var(--accent); }
  .row { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) { .row { grid-template-columns: minmax(0, 1fr); } }
  video { width: 100%; border-radius: 8px; background: #000; max-height: 70vh; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spin { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .verdict { padding: 12px 14px; border-radius: 8px; font-weight: 600; font-size: 17px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .viol { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .viol h3 { margin: 0 0 6px; font-size: 16px; }
  .tc { font-variant-numeric: tabular-nums; background: none; border: 1px solid var(--border); color: var(--accent);
        border-radius: 6px; padding: 1px 8px; cursor: pointer; font: inherit; margin-right: 8px; }
  .frames { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .frames figure { margin: 0; }
  .frames img { height: 220px; max-width: 100%; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
  .frames figcaption { font-size: 12px; color: var(--muted); }
  .src { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .src li { margin: 2px 0; }
  .note { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .err { color: var(--bad); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center;
              justify-content: center; z-index: 10; cursor: zoom-out; }
  #lightbox img { max-width: 95vw; max-height: 95vh; }
</style>
</head>
<body>
<main>
  <h1>Контроль кассовой дисциплины</h1>
  <p class="sub">Загрузите видеозапись рабочего места кассира — сервис найдёт визуальные признаки возможных нарушений.</p>

  <div class="card">
    <label id="drop">
      <input id="file" type="file" accept=".mov,.mp4,.avi,.mkv,.m4v,video/*" hidden>
      <div><b>Выберите видео</b> или перетащите файл сюда</div>
      <div class="sub" style="margin:4px 0 0">.mov, до 500 МБ</div>
    </label>
  </div>

  <div class="row" id="workspace" hidden>
    <div class="card"><video id="player" controls muted playsinline></video></div>
    <div class="card" id="result"></div>
  </div>

  <p class="note">Результат — подсказка для проверки человеком, а не окончательное заключение.
    Анализ выполняется локально, видео не передаётся во внешние сервисы.</p>
</main>
<div id="lightbox"><img alt=""></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (t) => { const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0"); return `${m}:${s}`; };

const drop = $("#drop"), input = $("#file"), result = $("#result"), player = $("#player");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => ev.dataTransfer.files[0] && start(ev.dataTransfer.files[0]));
input.addEventListener("change", () => input.files[0] && start(input.files[0]));

let pollTimer = null;

async function start(file) {
  clearTimeout(pollTimer);
  $("#workspace").hidden = false;
  player.src = URL.createObjectURL(file);
  setStatus(`Загрузка «${esc(file.name)}»…`);
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("ui/analyze", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    setStatus("Видео анализируется. Обычно это занимает до минуты…");
    poll(j.job_id, Date.now());
  } catch (e) { result.innerHTML = `<p class="err">Ошибка загрузки: ${esc(e.message)}</p>`; }
}

async function poll(id, t0) {
  try {
    const r = await fetch(`ui/jobs/${id}`);
    const j = await r.json();
    if (j.status === "processing") {
      setStatus(`Видео анализируется… ${Math.round((Date.now() - t0) / 1000)} с`);
      pollTimer = setTimeout(() => poll(id, t0), 1500);
    } else if (j.status === "done") render(j);
    else result.innerHTML = `<p class="err">Обработка не удалась: ${esc(j.error || "неизвестная ошибка")}</p>`;
  } catch (e) { pollTimer = setTimeout(() => poll(id, t0), 3000); }
}

function setStatus(text) { result.innerHTML = `<div class="status"><div class="spin"></div><span>${text}</span></div>`; }

function render(j) {
  const v = j.violations || [];
  let html = v.length
    ? `<div class="verdict bad">Обнаружены признаки возможных нарушений: ${v.length}</div>`
    : `<div class="verdict ok">Нарушение не обнаружено</div>`;
  for (const x of v) {
    const frames = (x.evidence_frames || []).map(f =>
      `<figure><img src="data:image/jpeg;base64,${f.image_base64}" alt="кадр ${fmt(f.timestamp_sec)}">
       <figcaption>${fmt(f.timestamp_sec)}</figcaption></figure>`).join("");
    const srcs = (x.rule?.sources || []).map(s =>
      `<li>${esc(s.document)}, ${esc(s.clause)}${s.url ? ` — <a href="${esc(s.url)}" target="_blank" rel="noopener">источник</a>` : ""}</li>`).join("");
    html += `<div class="viol">
      <h3><button class="tc" data-t="${x.timecode_sec}">${fmt(x.timecode_sec)}</button>${esc(x.type)}</h3>
      <div>${esc(x.description)}</div>
      <div class="frames">${frames}</div>
      <div class="src">${srcs ? `Нормативная основа:<ul>${srcs}</ul>` : "Нормативная ссылка уточняется."}</div>
    </div>`;
  }
  html += `<p class="note">Время обработки: ${j.processing_sec ?? "—"} с</p>`;
  result.innerHTML = html;
}

result.addEventListener("click", ev => {
  const tc = ev.target.closest(".tc");
  if (tc) { player.currentTime = Math.max(0, +tc.dataset.t - 1); player.play(); }
  const img = ev.target.closest(".frames img");
  if (img) { $("#lightbox img").src = img.src; $("#lightbox").style.display = "flex"; }
});
$("#lightbox").addEventListener("click", () => $("#lightbox").style.display = "none");
</script>
</body>
</html>
