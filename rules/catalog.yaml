# Каталог типов нарушений и нормативных источников.
# Владелец: роль «Нормативка и данные».
#
# Правила заполнения sources:
#  - только акты РК (НБРК, adilet.zan.kz) или открытые документы банков РК;
#  - document / clause / url / quote — копировать из оригинала, не по памяти;
#  - verified: true ставить только после сверки с текстом на adilet.zan.kz.
#    Источники с verified: false в ответ сервиса НЕ попадают.
#  - match: direct — норма прямо описывает наблюдаемое поведение;
#           indirect — норма задаёт требование, из которого поведение следует
#           (например, требование к устройству помещения или к настройке ИС).
#
# Сверка цитат: 17.10.2026 по текстам НЦПС «Әділет» (old.adilet.zan.kz — та же база;
# новый adilet.zan.kz отдаёт тексты только через JS). Каждая quote проверена скриптом
# как точная подстрока текста акта (с нормализацией пробелов). Все три акта действующие,
# тексты включают изменения 2022–2025 гг.

# Используемые акты:
#  [КО]  Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей ...
#        Постановление Правления НБРК от 29.11.2019 № 231 (рег. № 19680) — V1900019680
#  [ОУП] Правила организации охраны и устройства помещений банков второго уровня ...
#        Постановление Правления НБРК от 24.02.2020 № 14 (рег. № 20075) — V2000020075
#  [ИБ]  Требования к обеспечению информационной безопасности банков ...
#        Постановление Правления НБРК от 27.03.2018 № 48 (рег. № 16772) — V1800016772

violation_types:
  - id: unattended_valuables
    name: Ценности оставлены без присмотра
    summary: Кассир покинул рабочее место, оставив на столе наличные, ценности, инкассаторскую сумку или кассовые документы, не убрав их в сейф/запирающееся устройство.
    observable: на столе видны деньги/сумка/рулоны/журнал, кассира нет у стола дольше порога
    examples: [Х-15@15, Х-26@9, Х-24@8]
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 20, ч. 2"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
        match: direct
        verified: true

  - id: unlocked_workstation
    name: Рабочее место оставлено с незаблокированным компьютером
    summary: Кассир покинул рабочее место, не заблокировав компьютер (на экране открыто рабочее приложение, а не экран блокировки).
    observable: экран ноутбука показывает рабочее содержимое (не экран блокировки), кассира нет у стола дольше порога
    examples: [Х-11@18, Х-22@14, Х-28@7]
    negatives: [Х-23, Х-29]  # экран горит, но это экран блокировки Windows — НЕ нарушение
    sources:
      - document: "Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций (утв. постановлением Правления НБРК от 27.03.2018 № 48)"
        clause: "п. 71, пп. 9"
        url: "https://adilet.zan.kz/rus/docs/V1800016772"
        quote: "при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает сеанс работы пользователя либо блокирует рабочую станцию или ноутбук с возможностью разблокировки только при вводе аутентификационных данных пользователя."
        match: indirect  # норма об автоблокировке через 30 мин; явного требования блокировать при уходе в актах НБРК нет
        verified: true

  - id: phone_use
    name: Использование мобильного телефона на рабочем месте
    summary: Кассир пользуется смартфоном (устройством с камерой) в кассовом узле.
    observable: телефон в руке кассира
    examples: [X-2@10, Х-20@5]
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 12, ч. 2"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации."
        match: indirect  # запрещены средства связи с фото/видео (смартфоны); наличие камеры по видео не проверяется
        verified: true

  - id: food_drink
    name: Приём пищи или напитков на рабочем месте
    summary: Кассир ест или пьёт на рабочем месте, где совершаются операции с ценностями.
    observable: еда/чашка/бутылка в руке кассира у лица
    examples: [X-1@22, Х-46@11]
    # В актах НБРК (КО, ОУП, ИБ) нормы о приёме пищи нет; в открытых документах банков РК не найдено.
    # Обычно регулируется внутренними документами банка. Источник не указываем, чтобы не выдумывать.
    sources: []

  - id: personal_items
    name: Личные вещи на рабочем месте кассира
    summary: На рабочем столе кассира размещены личные вещи (сумка, одежда).
    observable: сумка/одежда на столе кассира
    examples: [Х-40@17]
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 12, ч. 1"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка."
        match: direct
        verified: true

  - id: unauthorized_access
    name: Посторонний в кассовой зоне
    summary: В зону кассира заходит или передаёт кассиру предметы постороннее лицо (не клиент за столом).
    observable: второй человек на стороне кассира / передача предметов через неё
    examples: [Х-18@20, Х-30@13]
    sources:
      - document: "Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций (утв. постановлением Правления НБРК от 27.03.2018 № 48)"
        clause: "п. 18, пп. 1"
        url: "https://adilet.zan.kz/rus/docs/V1800016772"
        quote: "реализует меры физической и технической безопасности в банке, организации, в том числе организует пропускной и внутриобъектовый режим;"
        match: indirect  # общая обязанность организовать пропускной режим; прямого запрета посторонним в кассе в актах НБРК нет
        verified: true

  - id: door_left_open
    name: Дверь кассы оставлена открытой
    summary: Кассир вошёл в кассовое помещение и не закрыл за собой дверь.
    observable: дверь открыта после входа кассира и остаётся открытой дольше порога
    examples: [Х-32@5, Х-33@6]
    negatives: [Х-31]  # кассир закрывает дверь
    sources:
      - document: "Правила организации охраны и устройства помещений банков второго уровня ... (утв. постановлением Правления НБРК от 24.02.2020 № 14)"
        clause: "п. 16, пп. 1 (в редакции на период приостановления до 01.01.2027)"
        url: "https://adilet.zan.kz/rus/docs/V2000020075"
        quote: "1) каждая касса имеет отдельный вход с закрывающейся на замок дверью;"
        match: indirect  # требование к устройству помещения; поведенческая норма «держать закрытой» — во внутренних документах банка
        verified: true

  - id: cash_count_without_client
    name: Пересчёт наличных не в присутствии клиента
    summary: Принятые от клиента наличные пересчитываются после его ухода.
    observable: клиент передал деньги и ушёл; кассир начинает пересчёт (счётчик/руки) без клиента
    examples: [Х-34@13]
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 20, ч. 1"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
        match: direct
        verified: true

  - id: cash_left_in_client_zone
    name: Наличные предыдущей операции оставлены открыто при следующем клиенте
    summary: После ухода клиента деньги остаются на столе (на стороне клиента), пока входит и садится следующий клиент.
    observable: пачка банкнот на столе в момент входа нового клиента
    examples: [Х-4@57, Х-38@33]
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 20, ч. 2"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
        match: direct
        verified: true

  - id: cash_handling
    name: Пересчёт без счётчика/проверки подлинности
    summary: Кассир пересчитывает банкноты вручную, не пропуская их через счётчик/детектор подлинности.
    observable: полистный пересчёт руками на столе без использования счётчика/детектора
    examples: [Х-44@16, Х-4@68, Х-13@47 (неуверенно)]
    negatives: [Х-43, Х-45, Х-14]  # ручная работа с купюрами после проверки на детекторе — не нарушение
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 41"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "Банки осуществляют кассовые операции по пересчету и сортировке наличных денег на оборудовании, имеющем функцию проверки не менее двух машиночитаемых защитных признаков банкнот и монет"
        match: direct
        verified: true
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 19, пп. 2"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег"
        match: direct
        verified: true

  - id: collection_handover
    name: Нарушение порядка приёма инкассаторской сумки
    summary: Инкассатор оставляет сумку и уходит, не дождавшись проверки её целостности и пломбы кассиром.
    observable: инкассатор кладёт сумку на стол и покидает кадр в течение нескольких секунд
    examples: [Х-17@7]
    negatives: [Х-16]  # инкассатор ждёт, пока кассир проверяет сумку
    sources:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 24, пп. 3–4; п. 25"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности."
        match: indirect  # проверка целостности/пломбы (п. 24) и вскрытие при инкассаторе (п. 25) невозможны, если он ушёл
        verified: true

  - id: stub
    name: Тестовое событие (заглушка)
    summary: Используется только для проверки сервиса.
    observable: —
    sources: []
